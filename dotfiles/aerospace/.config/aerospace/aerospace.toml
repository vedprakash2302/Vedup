# Vedup-managed AeroSpace policy: five task-oriented workspaces, Vim-style
# focus controls, and sensible floating defaults for transient windows.
after-login-command = []
after-startup-command = [
  'exec-and-forget borders hidpi=on style=round active_color=0xFFD357FE inactive_color=0xAA494d64 width=8.0',
]

start-at-login = true
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
accordion-padding = 150
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
# on-focus-changed = ["move-mouse window-lazy-center"]

# Looser spacing on external displays, compact spacing on the built-in panel.
[gaps]
inner.horizontal = [{ monitor."built-in" = 20 }, 36]
inner.vertical = [{ monitor."built-in" = 16 }, 36]
outer.left = [{ monitor."built-in" = 16 }, 28]
outer.bottom = [{ monitor."built-in" = 16 }, 28]
outer.top = [{ monitor."built-in" = 4 }, 2]
outer.right = [{ monitor."built-in" = 16 }, 28]

[mode.main.binding]
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

alt-h = 'focus --boundaries-action wrap-around-the-workspace left'
alt-j = 'focus --boundaries-action wrap-around-the-workspace down'
alt-k = 'focus --boundaries-action wrap-around-the-workspace up'
alt-l = 'focus --boundaries-action wrap-around-the-workspace right'
alt-f = 'fullscreen'

alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

alt-ctrl-h = ['join-with left']
alt-ctrl-j = ['join-with down']
alt-ctrl-k = ['join-with up']
alt-ctrl-l = ['join-with right']
alt-ctrl-f = ['layout floating tiling']
alt-ctrl-esc = ['reload-config', 'mode main']

alt-shift-minus = 'resize smart -50'
alt-shift-equal = 'resize smart +50'

alt-1 = 'workspace --auto-back-and-forth 1'
alt-2 = 'workspace --auto-back-and-forth 2'
alt-3 = 'workspace --auto-back-and-forth 3'
alt-4 = 'workspace --auto-back-and-forth 4'
alt-5 = 'workspace --auto-back-and-forth 5'

alt-shift-1 = 'move-node-to-workspace 1 --focus-follows-window'
alt-shift-2 = 'move-node-to-workspace 2 --focus-follows-window'
alt-shift-3 = 'move-node-to-workspace 3 --focus-follows-window'
alt-shift-4 = 'move-node-to-workspace 4 --focus-follows-window'
alt-shift-5 = 'move-node-to-workspace 5 --focus-follows-window'

alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

alt-shift-semicolon = 'mode service'

[workspace-to-monitor-force-assignment]

1 = ['main']
2 = ['main']
3 = ['main']
4 = ['main']
5 = ['secondary', 'main']


[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = [
  'layout floating tiling',
  'mode main',
]
backspace = ['close-all-windows-but-current', 'mode main']

[[on-window-detected]]
if.app-name-regex-substring = 'Cursor'
run = ['layout tiling', 'move-node-to-workspace 1']

[[on-window-detected]]
if.app-name-regex-substring = 'Ghostty'
run = ['layout tiling', 'move-node-to-workspace 1']

[[on-window-detected]]
if.app-name-regex-substring = 'Warp'
run = ['layout tiling', 'move-node-to-workspace 1']

[[on-window-detected]]
if.app-name-regex-substring = 'Craft'
if.app-id = 'com.lukilabs.lukiapp'
run = ['layout tiling', 'move-node-to-workspace 2']

[[on-window-detected]]
if.app-name-regex-substring = 'Outlook'
run = ['layout tiling', 'move-node-to-workspace 3']


[[on-window-detected]]
if.app-name-regex-substring = 'Slack'
run = ['layout tiling', 'move-node-to-workspace 3']


[[on-window-detected]]
if.app-name-regex-substring = 'Mail'
run = ['layout tiling', 'move-node-to-workspace 3']

[[on-window-detected]]
if.app-name-regex-substring = 'Calendar'
run = ['layout tiling', 'move-node-to-workspace 3']

[[on-window-detected]]
if.app-name-regex-substring = 'WhatsApp'
run = ['layout tiling', 'move-node-to-workspace 4']

[[on-window-detected]]
if.app-name-regex-substring = 'Linear'
run = ['layout tiling', 'move-node-to-workspace 4']


# Meetings and utility windows stay floating.
[[on-window-detected]]
if.app-name-regex-substring = 'Zoom'
run = ['layout floating', 'move-node-to-workspace 3']

[[on-window-detected]]
if.app-name-regex-substring = 'Teams'
run = ['layout floating', 'move-node-to-workspace 3']

[[on-window-detected]]
check-further-callbacks = true
if.app-name-regex-substring = 'Arc'
run = ['layout floating']

[[on-window-detected]]
if.app-name-regex-substring = 'Finder'
run = ['layout floating']

[[on-window-detected]]
check-further-callbacks = true
run = 'layout floating'
